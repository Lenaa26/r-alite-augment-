<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Et si ce lieu n’appartenait pas à notre réalité ?</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    .scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }
    .background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      animation: color-pulse 30s ease-in-out infinite;
      will-change: filter, transform;
    }
    .darkness {
      position: absolute;
      inset: 0;
      background: #000;
      opacity: 0;
      animation: breathe 12s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.04; }
      50% { opacity: 0.34; }
    }
    @keyframes color-pulse {
      0%, 100% {
        filter: brightness(1) contrast(1.05) saturate(1.05);
        transform: scale(1);
      }
      50% {
        filter: brightness(0.62) contrast(1.9) saturate(2.1);
        transform: scale(1.035);
      }
    }
    @keyframes subtle-zoom {
      from { transform: scale(1); }
      to { transform: scale(1.035); }
    }
    @media (prefers-reduced-motion: reduce) {
      .darkness, .background { animation-duration: 24s; }
    }

    /* Adaptation aux petits écrans : la photo remplit toujours la fenêtre. */
    @media (max-width: 600px) {
      .background { object-position: center center; }
    }

    /* Écran d'accès avant 19 h et après minuit */
    .access-gate {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center;
      padding: 28px; background: rgba(0,0,0,.88); color: white;
      text-align: center; font: 16px/1.6 system-ui, sans-serif;
    }
    .access-gate[hidden] { display: none; }
    .gate-message { max-width: 330px; }
    .gate-message h1 { font-size: 1.45rem; margin: 0 0 12px; }
    .story-panel {
      position: absolute; inset: 1cm; z-index: 5; overflow-y: auto; overscroll-behavior: contain;
      border-radius: 22px; background: rgba(0,0,0,.62);
      border: 1px solid rgba(255,255,255,.15);
      color: #fff; padding: 28px 22px 54px;
      display: flex; align-items: center; justify-content: center;
      text-align: center; font: 16px/1.6 system-ui, sans-serif;
      opacity: 0; visibility: hidden; transform: translateX(24px);
      transition: opacity .28s ease, transform .28s ease, visibility .28s;
      backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
      touch-action: pan-y;
    }
    .story-panel.visible { opacity: 1; visibility: visible; transform: translateX(0); }
    .story-content { max-width: 520px; width: 100%; white-space: pre-line; margin: auto; }
    .story-content h2 { margin: 0 0 18px; font-size: 1.18em; line-height: 1.35; font-weight: 600; }
    .story-content p { margin: 0 0 1em; }
    .artwork-slide { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
    .artwork-slide img { display: block; max-width: 100%; max-height: min(68vh, 760px); width: auto; height: auto; object-fit: contain; border-radius: 3px; }
    .artwork-caption { font-size: .88em; opacity: .85; }
    .story-dots {
      position: absolute; z-index: 6; bottom: max(22px, env(safe-area-inset-bottom));
      left: 50%; transform: translateX(-50%); display: flex; gap: 7px;
      align-items: center; justify-content: center;
    }
    .story-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.48); transition: all .2s; }
    .story-dot.active { background: #fff; transform: scale(1.25); }
    .swipe-hint {
      position: absolute; z-index: 4; bottom: max(52px, calc(env(safe-area-inset-bottom) + 35px));
      left: 50%; transform: translateX(-50%); color: rgba(255,255,255,.9);
      font: 12px/1.4 system-ui,sans-serif; text-shadow: 0 1px 6px #000;
      white-space: nowrap; animation: hint-pulse 2s ease-in-out infinite;
      pointer-events: none;
    }
    .swipe-hint[hidden] { display:none; }
    @keyframes hint-pulse { 0%,100% { opacity:.55 } 50% { opacity:1 } }
    @media (max-width: 600px) {
      .story-panel { inset: 1cm; padding: 24px 18px 48px; border-radius: 20px; }
    }

  </style>
</head>

      `<h2>Et si ce lieu n’appartenait pas à notre réalité ?</h2>
      <p>Et si, derrière les murs, les lumières et l’atmosphère de ces couloirs, se cachait une autre réalité ? Une réalité qui ne serait pas inscrite dans le présent mais dans le souvenir.</p>
      <p>Ce que nous percevons à un instant donné est constamment influencé par nos souvenirs. Un lieu que l’on découvre pour la première fois ne sera jamais tout à fait le même lorsque nous y reviendrons. Non pas parce qu’il aura nécessairement changé, mais parce que notre regard, lui, aura évolué. Des détails autrefois imperceptibles nous sembleront soudain évidents, tandis que d’autres auront disparu de notre perception.</p>
      <p>Après tout, qui est capable de se souvenir précisément de chaque atmosphère, de chaque lumière, de chaque ombre, de chaque disposition de l’espace, de chaque son ou de chaque odeur d’un lieu que l’on a traversé ?</p>
      <p>Notre mémoire ne conserve pas la totalité de ce que nous vivons. Elle en retient seulement quelques fragments, parfois infimes, parfois inattendus. Une lumière sur un mur, un couloir vide, une silhouette qui passe, un bruit lointain… Ces éléments deviennent les traces d’une expérience passée, les morceaux d’un lieu qui, peu à peu, se transforme en souvenir.</p>
      <p>Il ne s’agit donc peut-être pas de chercher à représenter le lieu dans son intégralité, ni de restituer fidèlement ce qu’il est à un instant précis. Il s’agirait plutôt de s’intéresser à ce qu’il laisse derrière lui : ces quelques détails que notre mémoire choisit de conserver, et qui finissent par constituer notre propre perception de cet espace.</p>`,

      `<h2>Des souvenirs qui s’effacent</h2>
      <p>Une photographie permet de conserver un instant. Pourtant, avec le temps, les souvenirs ne restent pas toujours intacts : certains détails disparaissent, d’autres se transforment, et il ne reste parfois que quelques fragments.</p>
      <p>Une technique permet de transférer une photographie sur du ruban adhésif : celui-ci est placé sur l’image, puis arraché rapidement. Le papier resté collé au ruban est ensuite humidifié et frotté délicatement pour être retiré. Après séchage, l’image apparaît directement sur le scotch.</p>
      <p>Ce procédé transforme une photographie classique en une image fragile, irrégulière et parfois difficile à distinguer. Elle semble avoir été altérée par le temps, comme un souvenir dont il ne resterait que quelques morceaux.</p>
      <p>Cette technique fait écho à la mémoire humaine : les souvenirs évoluent, s’effacent ou se transforment au fil du temps. Dans une gare, des milliers de personnes se croisent, attendent ou repartent. Chacune traverse des moments différents, mais la plupart de ces instants disparaissent sans laisser de trace visible.</p>
      <p>La gare devient alors bien plus qu’un simple lieu de passage : elle peut être imaginée comme un espace rempli de souvenirs, de sensations et d’histoires invisibles.</p>`
    ];

    const panel = document.getElementById('storyPanel');
    const content = document.getElementById('storyContent');
    const dots = document.getElementById('storyDots');
    const hint = document.getElementById('swipeHint');
    let currentPage = 0;
    let panelOpened = false;
    let touchStartX = null;
    let touchStartY = null;
    function renderPage() {
      content.innerHTML = pages[currentPage];
      dots.querySelectorAll('.story-dot').forEach((dot, index) => {
        dot.classList.toggle('active', index === currentPage);
      });
    }
    pages.forEach((_, index) => {
      const dot = document.createElement('span');
      dot.className = 'story-dot' + (index === 0 ? ' active' : '');
      dot.setAttribute('aria-label', 'Page ' + (index + 1) + ' sur ' + pages.length);
      dots.appendChild(dot);
    });
    function openPanel() {
      panelOpened = true;
      panel.classList.add('visible');
      hint.hidden = true;
      renderPage();
    }
    function handleSwipe(deltaX, deltaY) {
      if (Math.abs(deltaX) < 45 || Math.abs(deltaX) < Math.abs(deltaY) * 1.2) return;
      if (deltaX < 0) {
        if (!panelOpened) openPanel();
        else currentPage = (currentPage + 1) % pages.length;
      } else if (panelOpened) {
        if (currentPage > 0) currentPage--;
        else {
          panelOpened = false;
          panel.classList.remove('visible');
          hint.hidden = false;
          return;
        }
      }
      renderPage();
    }
    document.addEventListener('touchstart', event => {
      if (!event.changedTouches.length) return;
      touchStartX = event.changedTouches[0].clientX;
      touchStartY = event.changedTouches[0].clientY;
    }, { passive: true });
    document.addEventListener('touchend', event => {
      if (touchStartX === null || !event.changedTouches.length) return;
      const dx = event.changedTouches[0].clientX - touchStartX;
      const dy = event.changedTouches[0].clientY - touchStartY;
      handleSwipe(dx, dy);
      touchStartX = touchStartY = null;
    }, { passive: true });
    // Petit support souris pour tester la navigation sur ordinateur.
    let mouseStartX = null, mouseStartY = null;
    document.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse') { mouseStartX = e.clientX; mouseStartY = e.clientY; }
    });
    document.addEventListener('pointerup', e => {
      if (e.pointerType === 'mouse' && mouseStartX !== null) {
        handleSwipe(e.clientX - mouseStartX, e.clientY - mouseStartY);
        mouseStartX = mouseStartY = null;
      }
    });
  </script>
